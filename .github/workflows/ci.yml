name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests
        run: |
          swiftc \
            Models/Subscription.swift \
            Models/CircularBuffer.swift \
            Models/ServerDescription.swift \
            Tests/main.swift \
            -o /tmp/flakemq-core-tests
          /tmp/flakemq-core-tests

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project FlakeMQ.xcodeproj
      - name: Build
        run: |
          xcodebuild \
            -project FlakeMQ.xcodeproj \
            -scheme FlakeMQ \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
